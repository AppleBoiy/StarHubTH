name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6, needed for typed throws)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 16.x found on this runner. StarHubTH's typed throws (throws(ErrorType)) needs Swift 6 (Xcode 16+)."
            ls /Applications | grep -i xcode
            exit 1
          fi
          echo "[INFO] Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Standards check (advisory)
        run: python3 scripts/check_standards.py

      - name: Build
        run: xcodebuild build -project StarHubTH.xcodeproj -scheme StarHubTH -configuration Debug

      - name: Test
        # Live-network Integration tests (Tests/Integration/) are skipped via
        # STARHUB_SKIP_LIVE_TESTS, baked into the StarHubTH scheme's TestAction by
        # project.yml (schemes.StarHubTH.test.environmentVariables) — NOT settable here.
        # `xcodebuild test`'s scheme has `shouldUseLaunchSchemeArgsEnv`, so a `env:` block
        # on this step never reaches the test process; only a scheme-declared variable does.
        run: xcodebuild test -project StarHubTH.xcodeproj -scheme StarHubTH -configuration Debug -destination 'platform=macOS' -only-testing:StarHubTHTests
