name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Standards check (advisory)
        run: python3 scripts/check_standards.py

      - name: Build
        run: python3 build_app.py

      - name: Test
        env:
          STARHUB_SKIP_LIVE_TESTS: "1"
        run: python3 run_tests.py
