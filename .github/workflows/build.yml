name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6, needed for typed throws)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 16.x found on this runner. StarHubTH's typed throws (throws(ErrorType)) needs Swift 6 (Xcode 16+)."
            ls /Applications | grep -i xcode
            exit 1
          fi
          echo "[INFO] Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Standards check (advisory)
        run: python3 scripts/check_standards.py

      - name: Build
        run: xcodebuild build -project StarHubTH.xcodeproj -scheme StarHubTH -configuration Debug

      - name: Test
        # -testPlan Unit runs Models/Services/Features only — Tests/Integration/ isn't part
        # of this plan's selectedTests at all, so it can't slip through in CI regardless of
        # parallelism. STARHUB_SKIP_LIVE_TESTS is baked into TestPlans/Unit.xctestplan's own
        # environmentVariableEntries (see SWIFT_STANDARDS.md §10) — NOT settable via a
        # workflow `env:` block here: `xcodebuild test`'s scheme has
        # `shouldUseLaunchSchemeArgsEnv`, so a step-level `env:` never reaches the test
        # process; only a scheme- or test-plan-declared variable does.
        run: xcodebuild test -project StarHubTH.xcodeproj -scheme StarHubTH -configuration Debug -destination 'platform=macOS' -testPlan Unit
