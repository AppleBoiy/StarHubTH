name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6, needed for typed throws)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 16.x found on this runner. StarHubTH's typed throws (throws(ErrorType)) needs Swift 6 (Xcode 16+)."
            ls /Applications | grep -i xcode
            exit 1
          fi
          echo "[INFO] Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Verify tag matches Info.plist
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plist_version=$(python3 -c "import plistlib; print(plistlib.load(open('Info.plist','rb'))['CFBundleShortVersionString'])")
          if [ "$tag_version" != "$plist_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist CFBundleShortVersionString ($plist_version). Use scripts/bump_version.py before tagging."
            exit 1
          fi

      - name: Test
        # See build.yml: live-network Integration tests aren't part of the Unit test plan
        # at all — STARHUB_SKIP_LIVE_TESTS is baked into TestPlans/Unit.xctestplan, not a
        # workflow `env:` block, which never reaches the test process.
        run: xcodebuild test -project StarHubTH.xcodeproj -scheme StarHubTH -configuration Debug -destination 'platform=macOS' -testPlan Unit

      - name: Build, package, and publish release
        id: release
        run: python3 release.py --publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload release to Nexus Mods
        uses: Nexus-Mods/upload-action@19da5c91527877cd0bfedc6e6239c911035846a0 # v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7706256"
          filename: ${{ steps.release.outputs.zip_path }}
          version: ${{ steps.release.outputs.version }}
          description: ${{ steps.release.outputs.changelog_notes }}
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
